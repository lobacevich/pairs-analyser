spring:
  application:
    name: pairs-analyzer

  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate.ddl-auto: validate
    show-sql: true
    properties.hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      format_sql: true
      jdbc:
        time_zone: UTC

  liquibase:
    enabled: true
    drop-first: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

binance:
  api:
    url: ${BINANCE_API_URL:https://api.binance.com}
    symbol: ${BINANCE_SYMBOL:BNBUSDT}

poll:
  interval: ${BINANCE_POLL_INTERVAL:PT30S}

trend:
  min-slope-threshold: 0.001
  min-r-square: 0.3

logging:
  file.name: logs/log.log
  level:
    org.hibernate:
      SQL: debug
      type.descriptor.sql.BasicBinder: trace
    org.springframework: debug